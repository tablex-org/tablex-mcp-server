name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.1.2
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Resolve release tag
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${{ github.event.release.tag_name }}"
          fi
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Checkout MCP repo
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify package version matches tag
        run: |
          node -e 'const p=require("./package.json"); if (p.version !== process.env.VERSION) { throw new Error(`package.json ${p.version} != tag ${process.env.VERSION}`) }'
        env:
          VERSION: ${{ steps.release.outputs.version }}

      - name: Test
        run: npm test

      - name: Build release artifact
        run: npm run package:release

      - name: Compute artifact metadata
        id: artifact
        run: |
          file="release/tablex-mcp-server-${{ steps.release.outputs.version }}.tar.gz"
          sha="$(shasum -a 256 "$file" | cut -d ' ' -f 1)"
          size="$(stat -f %z "$file")"
          url="https://github.com/${{ github.repository }}/releases/download/${{ steps.release.outputs.tag }}/tablex-mcp-server-${{ steps.release.outputs.version }}.tar.gz"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Upload release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.release.outputs.tag }}" "${{ steps.artifact.outputs.file }}" --clobber

      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          repository: tablex-org/tablex
          token: ${{ secrets.TABLEX_APP_REPO_TOKEN }}
          path: app-repo

      - name: Sync app manifests
        run: npm run sync:app-manifest
        env:
          APP_REPO: ${{ github.workspace }}/app-repo
          VERSION: ${{ steps.release.outputs.version }}
          TARBALL_URL: ${{ steps.artifact.outputs.url }}
          SHA256: ${{ steps.artifact.outputs.sha }}
          SIZE_BYTES: ${{ steps.artifact.outputs.size }}

      - name: Open app manifest PR
        uses: peter-evans/create-pull-request@v6
        with:
          path: app-repo
          token: ${{ secrets.TABLEX_APP_REPO_TOKEN }}
          branch: chore/tablex-mcp-server-${{ steps.release.outputs.version }}
          title: Update tablex MCP server to ${{ steps.release.outputs.version }}
          commit-message: chore: update tablex MCP server to ${{ steps.release.outputs.version }}
          body: |
            Updates tablex MCP server manifest entry.

            - Version: `${{ steps.release.outputs.version }}`
            - URL: `${{ steps.artifact.outputs.url }}`
            - SHA-256: `${{ steps.artifact.outputs.sha }}`
            - Size: `${{ steps.artifact.outputs.size }}`
